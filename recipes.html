<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Recipes</title>
  <meta name="description" content="Shopping lists and a recipe notebook: scale servings, run step timers and add ingredients to your list.">
  <link rel="manifest" href="./recipes/manifest.json">
  <link rel="icon" href="./recipes/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./recipes/icon.png">
  <meta name="theme-color" content="#f5f3ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Recipes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&display=swap">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    /* "Market" palette from the design; always light. */
    :root{
      color-scheme:light;
      --bg:#f5f3ec;--surface:#ffffff;--ink:#1e2a1b;--muted:#686f62;
      --line:rgba(30,42,27,.09);--cb-line:rgba(30,42,27,.3);
      --accent:oklch(0.87 0.18 125);--accent-ink:#1e2a1b;
      --soft:oklch(0.94 0.07 125);--soft-ink:oklch(0.42 0.1 130);--dot:oklch(0.62 0.17 130);
      --ph-a:#e6e5d7;--ph-b:#eeede3;--nav-bg:#f5f3ec;
      --chip-on:#1e2a1b;--chip-on-ink:#f5f3ec;--error:oklch(0.55 0.18 30);
      --font:'Bricolage Grotesque',system-ui,sans-serif;
      --r:20px;--row-r:14px;--pill:999px;
      --nav-h:calc(64px + env(safe-area-inset-bottom));
    }
    *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body,#app{margin:0;min-height:100%}
    body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);-webkit-text-size-adjust:100%}
    button,input,textarea{font:inherit;color:inherit}
    button{cursor:pointer;touch-action:manipulation}
    button:disabled{cursor:default}
    a{color:inherit}
    button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,label:focus-within{outline:2px solid var(--dot);outline-offset:2px}
    h1,h2,p{margin:0}
    @keyframes raSlide{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
    @keyframes raUp{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

    .ra{max-width:560px;margin:0 auto;padding-bottom:var(--nav-h)}
    .ra-screen{padding:calc(14px + env(safe-area-inset-top)) 22px 28px}
    .ra-slide{animation:raSlide .28s ease-out}
    .ra-eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
    .ra-eyebrow a{text-decoration:none;font-size:20px;line-height:1;letter-spacing:0;padding:0 2px 2px 0}
    .ra-title{font-weight:700;font-size:36px;letter-spacing:-0.035em;line-height:1.05;margin-top:8px;text-wrap:pretty;overflow-wrap:anywhere}
    .ra-title.editable{cursor:text}
    .ra-title.detail{font-size:32px;margin-top:12px}
    .ra-title-input{display:block;width:100%;padding:0;background:transparent;border:none;border-bottom:2px solid var(--accent);outline:none;border-radius:0}
    .ra-title-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
    .ra-title-row .ra-title{margin-top:0}
    .ra-muted{color:var(--muted);font-size:14px;line-height:1.5;text-wrap:pretty}
    .ra-muted.sm{font-size:12px}
    .ra-error{color:var(--error);font-size:13px}
    .ra-empty{padding:28px 0;text-align:center;font-size:15px;color:var(--muted)}
    .ra-empty.big{padding:56px 12px;display:flex;flex-direction:column;gap:6px}
    .ra-empty.big p:first-child{color:var(--ink);font-weight:600;font-size:17px}

    .ra-chips{display:flex;gap:8px;margin:18px -22px 0;padding:0 22px;overflow-x:auto;scrollbar-width:none}
    .ra-chips::-webkit-scrollbar{display:none}
    .ra-chips.tight{margin:0;padding:0;flex-wrap:wrap}
    .ra-chip{flex:none;height:34px;padding:0 14px;border-radius:var(--pill);border:1px solid var(--line);background:transparent;font-size:14px;font-weight:500;display:flex;align-items:center;gap:7px}
    .ra-chip.sm{height:32px;font-size:13px}
    .ra-chip.on{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-ink)}
    .ra-chip.dashed{border:1px dashed var(--cb-line);color:var(--muted)}
    .ra-chip-count{opacity:.55;font-size:12px}

    .ra-add{display:flex;gap:8px;align-items:center;margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 6px 6px 16px}
    .ra-add input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:16px}
    .ra-add button{flex:none;width:40px;height:40px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);font-size:22px;line-height:1}
    .ra-section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 6px;font-size:13px;color:var(--muted)}
    .ra-section-head.cart{margin-bottom:2px}
    .ra-small-btn{height:30px;padding:0 12px;border-radius:var(--pill);border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500}
    .ra-small-btn.confirm{background:var(--error);border-color:var(--error);color:var(--bg)}

    .ra-row{height:54px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}
    .ra-row.drag{padding:0 10px;margin:0 -10px;position:relative;z-index:1;background:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;cursor:grab;transition:transform .18s ease,box-shadow .15s,background .15s}
    .ra-row.dragging{z-index:5;border-radius:var(--row-r);background:var(--surface);box-shadow:0 12px 28px -10px rgba(0,0,0,.3);transition:box-shadow .15s,background .15s;cursor:grabbing}
    .ra-check{flex:none;width:24px;height:24px;padding:0;border-radius:50%;border:1.5px solid var(--cb-line);background:transparent;color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;transition:background .15s}
    .ra-check.on{background:var(--accent);border-color:var(--accent)}
    .ra-row-name{flex:1;min-width:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text}
    .ra-row-name.done{color:var(--muted);text-decoration:line-through}
    .ra-row-q{margin-left:8px;font-size:14px;color:var(--muted)}
    .ra-row-input{flex:1;min-width:0;padding:4px 0;border:none;border-bottom:1.5px solid var(--accent);outline:none;background:transparent;font-size:16px;border-radius:0}
    .ra-grip{flex:none;display:flex;flex-direction:column;gap:3px;opacity:.45}
    .ra-grip span{width:14px;height:2px;border-radius:1px;background:var(--muted)}

    .ra-accent-btn{flex:none;height:40px;padding:0 16px 0 12px;border-radius:var(--pill);border:none;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
    .ra-accent-btn span{font-size:20px;line-height:1}
    .ra-field{display:block;width:100%;min-width:0;height:46px;padding:0 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);outline:none;font-size:16px}
    textarea.ra-field{height:auto;padding:12px 16px;resize:vertical;line-height:1.5;font-size:15px}
    .ra-search{margin-top:18px;font-size:15px}
    .ra-search::-webkit-search-cancel-button{opacity:.5}

    .ra-ph{position:relative;background:repeating-linear-gradient(135deg,var(--ph-a) 0 10px,var(--ph-b) 10px 20px)}
    .ra-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
    .ra-photo-wrap{position:relative;display:flex;flex-direction:column;gap:8px}
    .ra-photo-field{height:180px;border-radius:var(--r);overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .ra-photo-field.disabled{cursor:default;opacity:.7}
    .ra-photo-field input{position:absolute;width:1px;height:1px;opacity:0}
    .ra-photo-hint{position:relative;font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
    .ra-photo-change{position:absolute;left:12px;bottom:12px;padding:6px 12px;border-radius:var(--pill);background:rgba(0,0,0,.6);color:#fff;font-size:13px;font-weight:600}
    .ra-photo-remove{position:absolute;top:10px;right:10px;width:30px;height:30px;padding:0;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:13px}
    .ra-save-error{margin-top:10px}
    .ra-card{display:block;width:100%;padding:0;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
    .ra-card .ra-ph{height:118px}
    .ra-card.featured{margin-top:20px}
    .ra-card.featured .ra-ph{height:190px}
    .ra-card-body{padding:12px 12px 14px}
    .ra-card.featured .ra-card-body{padding:16px 18px 18px}
    .ra-card-title{font-weight:700;font-size:24px;letter-spacing:-0.035em;line-height:1.1;margin-top:10px}
    .ra-card-name{font-size:15px;font-weight:600;line-height:1.25;text-wrap:pretty}
    .ra-card-meta{font-size:13px;color:var(--muted);margin-top:4px}
    .ra-card.featured .ra-card-meta{font-size:14px;margin-top:6px}
    .ra-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px}
    .ra-tags{display:flex;gap:6px;flex-wrap:wrap}
    .ra-tag{font-size:12px;font-weight:500;padding:4px 10px;border-radius:var(--pill);background:var(--soft);color:var(--soft-ink)}

    .ra-detail{animation:raSlide .28s ease-out}
    .ra-detail-ph.has-photo{height:calc(280px + env(safe-area-inset-top))}
    .ra-detail-ph .ra-round-btn{position:relative}
    .ra-detail-ph{height:calc(170px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;padding:calc(12px + env(safe-area-inset-top)) 16px 0}
    .ra-round-btn{width:42px;height:42px;border-radius:50%;border:none;background:var(--bg);font-size:18px}
    .ra-round-btn.text{width:auto;padding:0 16px;border-radius:var(--pill);font-size:14px;font-weight:600}
    .ra-detail-body{padding:22px 22px 36px}
    .ra-servings{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding:10px 10px 10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
    .ra-servings>div:first-child{display:flex;flex-direction:column;gap:2px}
    .ra-stepper{display:flex;align-items:center;gap:4px}
    .ra-stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1}
    .ra-stepper button.plus{border:none;background:var(--accent);color:var(--accent-ink)}
    .ra-stepper input{width:44px;height:40px;padding:0;border:none;outline:none;background:transparent;text-align:center;font-size:20px;font-weight:600}
    .ra-sub-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:30px}
    .ra-sub-head h2,.ra-method-head{font-size:18px;font-weight:600}
    .ra-method-head{margin-top:32px}
    .ra-pill-btn{height:36px;padding:0 14px;border-radius:var(--pill);border:none;background:var(--soft);color:var(--soft-ink);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
    .ra-pill-btn.accent{background:var(--accent);color:var(--accent-ink)}
    .ra-ing{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;min-height:55px}
    .ra-ing-q{flex:none;width:72px;color:var(--muted)}
    .ra-ing-n{flex:1;min-width:0;overflow-wrap:anywhere}
    .ra-on-list{font-size:12px;color:var(--soft-ink);white-space:nowrap}
    .ra-ing-add{flex:none;width:30px;height:30px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--soft-ink);font-size:18px;line-height:1}
    .ra-steps{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:18px}
    .ra-steps li{display:flex;gap:14px}
    .ra-steps li>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;padding-top:3px}
    .ra-steps p{font-size:15px;line-height:1.55;text-wrap:pretty}
    .ra-step-n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--soft-ink);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
    .ra-timer-open{align-self:flex-start;height:30px;padding:0 12px;border-radius:var(--pill);border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px}
    .ra-timer-set{align-self:flex-start;display:flex;align-items:center;gap:6px;padding:4px;border-radius:var(--pill);background:var(--surface);border:1px solid var(--line)}
    .ra-timer-set button{width:30px;height:30px;border-radius:50%;border:none;background:var(--bg);font-size:16px}
    .ra-timer-set span{min-width:52px;text-align:center;font-size:14px;font-weight:600}
    .ra-timer-set .start{width:auto;padding:0 14px;border-radius:var(--pill);background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:600}
    .ra-timer-set .close{width:auto;padding:0 10px;background:transparent;color:var(--muted);font-size:13px}
    .ra-timer-run{align-self:stretch;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:var(--r);background:var(--soft);color:var(--soft-ink);position:relative;overflow:hidden}
    .ra-timer-run.done{background:var(--accent);color:var(--accent-ink)}
    .ra-timer-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--ink);opacity:.35;transition:width 1s linear}
    .ra-timer-clock{flex:1;font-size:24px;font-weight:600;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
    .ra-timer-run .pause{height:34px;padding:0 14px;border-radius:var(--pill);border:none;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600}
    .ra-timer-run .reset{height:34px;padding:0 10px;border:none;background:transparent;font-size:13px}

    .ra-compose-bar{display:flex;justify-content:space-between;align-items:center}
    .ra-text-btn{height:36px;padding:0;border:none;background:transparent;color:var(--muted);font-size:15px}
    .ra-segmented{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:18px;padding:4px;border-radius:var(--pill);background:var(--surface);border:1px solid var(--line)}
    .ra-segmented button{height:38px;border-radius:var(--pill);border:none;background:transparent;color:var(--muted);font-size:14px;font-weight:600;transition:background .2s}
    .ra-segmented button.on{background:var(--chip-on);color:var(--chip-on-ink)}
    .ra-segmented button.on.magic{background:var(--accent);color:var(--accent-ink)}
    .ra-form{display:flex;flex-direction:column;gap:16px;margin-top:18px}
    .ra-label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
    .ra-label .ra-field{color:var(--ink)}
    .ra-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
    .ra-notice{padding:12px 14px;border-radius:var(--r);background:var(--soft);color:var(--soft-ink);font-size:13px;line-height:1.45}
    .ra-drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:110px;padding:16px;border-radius:var(--r);border:1.5px dashed var(--cb-line);background:var(--surface);cursor:pointer;text-align:center;font-size:14px}
    .ra-drop input{position:absolute;width:1px;height:1px;opacity:0}
    .ra-drop-plus{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--soft-ink);display:flex;align-items:center;justify-content:center;font-size:20px}
    .ra-thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    .ra-thumb{position:relative;aspect-ratio:1;border-radius:var(--row-r);overflow:hidden;background:var(--ph-a)}
    .ra-thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .ra-thumb button{position:absolute;top:4px;right:4px;width:22px;height:22px;padding:0;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:11px}
    .ra-big-btn{height:52px;border-radius:var(--pill);border:none;background:var(--soft);color:var(--soft-ink);font-size:15px;font-weight:600}
    .ra-big-btn.accent{background:var(--accent);color:var(--accent-ink)}
    .ra-ed{display:flex;flex-direction:column;gap:10px;color:var(--ink)}
    .ra-ed-sec{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:4px 6px 4px 0}
    .ra-ed-head{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;border-bottom:1px solid var(--line)}
    .ra-ed-name{flex:1;min-width:0;height:36px;padding:0;border:none;outline:none;background:transparent;font-size:16px;font-weight:600}
    .ra-ed-sec-remove{flex:none;height:30px;padding:0 12px;border-radius:var(--pill);border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px}
    .ra-ed-sec-remove.confirm{background:var(--error);border-color:var(--error);color:var(--bg)}
    .ra-ed-list{position:relative}
    .ra-ed-row{position:relative;display:flex;align-items:flex-start;gap:4px;min-height:48px;border-bottom:1px solid var(--line);background:var(--surface)}
    .ra-ed-row.dragging{z-index:5;border-radius:var(--row-r);box-shadow:0 12px 28px -10px rgba(0,0,0,.3);opacity:.95}
    .ra-ed-grip{flex:none;width:40px;height:48px;padding:0;border:none;background:transparent;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    .ra-ed-row.dragging .ra-ed-grip{cursor:grabbing}
    .ra-ed-field{flex:1;min-width:0;min-height:48px;padding:13px 0;border:none;outline:none;background:transparent;color:var(--ink);font-size:16px;line-height:22px}
    .ra-ed-field.q{flex:none;width:76px;padding-right:8px;margin-right:4px;border-right:1px solid var(--line);color:var(--muted)}
    .ra-ed-field.step{display:block;resize:none;overflow:hidden;font-size:15px}
    .ra-ed-row .ra-step-n.sm{width:24px;height:24px;margin:12px 6px 0 0;font-size:12px}
    .ra-ed-remove{flex:none;width:36px;height:48px;padding:0;border:none;background:transparent;color:var(--muted);font-size:13px;opacity:.6}
    .ra-ed-drop{position:relative;height:0;z-index:4}
    .ra-ed-drop::after{content:"";position:absolute;left:8px;right:8px;top:-2px;height:4px;border-radius:2px;background:var(--dot)}
    .ra-ed-add{display:block;height:44px;padding:0 16px;border:none;background:transparent;color:var(--soft-ink);font-size:14px;font-weight:600}
    .ra-ed-add-sec{align-self:flex-start;height:36px;padding:0 14px;border-radius:var(--pill);border:1.5px dashed var(--cb-line);background:transparent;color:var(--ink);font-size:13px;font-weight:600}
    .ra-sec-head{margin-top:22px;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--soft-ink)}
    .ra-delete{margin-top:8px;height:44px;border-radius:var(--pill);border:1px solid var(--line);background:transparent;color:var(--error);font-size:14px;font-weight:600}
    .ra-delete.confirm{background:var(--error);border-color:var(--error);color:var(--bg)}

    .ra-conflict{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 22px 10px;background:var(--ink);color:var(--bg);font-size:14px}
    .ra-conflict span{flex:1 1 100%}
    .ra-conflict button{height:32px;padding:0 14px;border-radius:var(--pill);border:1px solid currentColor;background:transparent;font-size:13px;font-weight:600}
    .ra-toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px);transform:translateX(-50%);animation:raUp .2s ease-out;background:var(--ink);color:var(--bg);font-size:14px;padding:11px 18px;border-radius:var(--pill);max-width:calc(100vw - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);z-index:20}
    .ra-nav{position:fixed;left:0;right:0;bottom:0;z-index:15;height:var(--nav-h);display:flex;justify-content:center;border-top:1px solid var(--line);background:var(--nav-bg);padding-bottom:env(safe-area-inset-bottom)}
    .ra-nav button{flex:1;max-width:280px;border:none;background:transparent;font-size:14px;font-weight:400;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
    .ra-nav button.on{font-weight:600;color:var(--ink)}
    .ra-nav-dot{width:4px;height:4px;border-radius:2px;background:transparent;transition:width .2s}
    .ra-nav button.on .ra-nav-dot{width:20px;background:var(--dot)}
  </style>
</head>
