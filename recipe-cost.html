<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Recipe Cost</title>
  <meta name="description" content="Paste a recipe and get a cost breakdown at Aldi Suisse.">
  <link rel="icon" href="./recipe-cost/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    :root{
      --bg:#f6f5f2;
      --card:#fff;
      --fg:#15171a;
      --muted:#6b6f76;
      --line:#e4e2dd;
      --accent:#1d6b45;
      --accent-fg:#fff;
      --ok:#1f7a3d;
      --ok-bg:#e8f5ec;
      --warn:#9a4d00;
      --warn-bg:#fff3e0;
      --note-bg:#f1efea;
      --bad:#d62828;
      --radius:14px;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#111315;
        --card:#1b1e21;
        --fg:#eceef0;
        --muted:#9aa0a6;
        --line:#2c3035;
        --accent:#3f9b6c;
        --ok:#6fd08e;
        --ok-bg:#16291d;
        --warn:#ffb866;
        --warn-bg:#2e2214;
        --note-bg:#24272b;
      }
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{
      background:var(--bg);
      color:var(--fg);
      font:16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-text-size-adjust:100%;
    }
    main{
      width:min(640px, 100%);
      margin:0 auto;
      padding:max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
      display:grid;
      gap:14px;
    }
    h1{margin:0 0 2px;font-size:1.45rem;letter-spacing:-.01em}
    h2{margin:0;font-size:1.15rem}
    p{margin:0}
    a{color:var(--accent)}
    .muted{color:var(--muted)}
    .small{font-size:.85rem}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:16px;
    }
    .field-label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
    .input{
      width:100%;
      font:inherit;
      color:inherit;
      background:var(--bg);
      border:1px solid var(--line);
      border-radius:10px;
      padding:11px 12px;
      min-width:0;
    }
    textarea.input{resize:vertical;min-height:160px}
    .input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
    .input.narrow{width:130px}
    .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:12px}
    .hint{font-size:.8rem;color:var(--muted);margin-top:8px}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      font:inherit;font-weight:600;
      color:var(--fg);background:var(--card);
      border:1px solid var(--line);border-radius:10px;
      padding:12px 22px;cursor:pointer;
    }
    .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
    .btn:disabled{opacity:.45;cursor:default}
    .log{display:grid;gap:4px;font-size:.9rem;overflow-wrap:anywhere}
    .log .current{font-weight:600}
    .error{color:var(--bad);font-weight:600}
    .result{display:grid;gap:14px}
    .result .hint{margin:0}
    .stats{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;margin:0}
    .stats div{min-width:0;background:var(--note-bg);border-radius:10px;padding:10px 12px}
    .stats dt{font-size:.75rem;color:var(--muted)}
    .stats dd{margin:0;font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
    .items{list-style:none;margin:0;padding:0;display:grid}
    .item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
    .item:first-child{border-top:none;padding-top:0}
    .item-main{min-width:0}
    .item-name{font-weight:600}
    .note{font-style:italic}
    .item-cost{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
    .cost{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
    .badge{font-size:.7rem;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
    .badge.found{background:var(--ok-bg);color:var(--ok)}
    .badge.estimated{background:var(--warn-bg);color:var(--warn)}
    .badge.pantry{background:var(--note-bg);color:var(--muted)}
    .history{list-style:none;margin:0;padding:0;display:grid;gap:2px}
    .history li{display:flex;align-items:center;gap:6px;border-radius:10px;padding:2px 4px}
    .history li.active{background:var(--note-bg)}
    .link{
      flex:1;min-width:0;display:grid;text-align:left;
      font:inherit;color:inherit;background:none;border:none;padding:6px 4px;cursor:pointer;
    }
    .link span:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .small-btn{
      flex:none;font:inherit;font-size:.85rem;color:var(--muted);
      background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;
    }
    .small-btn:disabled{opacity:.45;cursor:default}
    footer{text-align:center;padding:4px 8px}
    @media (max-width:420px){
      .stats{grid-template-columns:1fr 1fr}
      .stats div:last-child{grid-column:1 / -1}
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./recipe-cost-app.js"></script>
</body>
</html>
