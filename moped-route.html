<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Moped Route</title>
  <meta name="description" content="Check Google Maps routes for roads over 50 km/h, and avoid them.">
  <link rel="manifest" href="./moped-route/manifest.json">
  <link rel="icon" href="./moped-route/icon.png" type="image/png">
  <link rel="apple-touch-icon" href="./moped-route/icon.png">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    :root{
      --bg:#f6f5f2;
      --card:#fff;
      --fg:#15171a;
      --muted:#6b6f76;
      --line:#e4e2dd;
      --accent:#e8590c;
      --accent-fg:#fff;
      --ok:#1f7a3d;
      --ok-bg:#e8f5ec;
      --warn:#9a4d00;
      --warn-bg:#fff3e0;
      --note-bg:#f1efea;
      --bad:#d62828;
      --route-osm:#2f6fdf;
      --route-google:#15171a;
      --radius:14px;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#111315;
        --card:#1b1e21;
        --fg:#eceef0;
        --muted:#9aa0a6;
        --line:#2c3035;
        --ok:#6fd08e;
        --ok-bg:#16291d;
        --warn:#ffb866;
        --warn-bg:#2e2214;
        --note-bg:#24272b;
        --route-google:#15171a;
      }
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{
      background:var(--bg);
      color:var(--fg);
      font:16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-text-size-adjust:100%;
    }
    main{
      width:min(640px, 100%);
      margin:0 auto;
      padding:max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
      display:grid;
      gap:14px;
    }
    h1{margin:0 0 2px;font-size:1.45rem;letter-spacing:-.01em}
    p{margin:0}
    .header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
    .muted{color:var(--muted)}
    .small{font-size:.85rem}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:16px;
    }
    .field-label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
    .input{
      width:100%;
      font:inherit;
      color:inherit;
      background:var(--bg);
      border:1px solid var(--line);
      border-radius:10px;
      padding:11px 12px;
      min-width:0;
    }
    .input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
    .input.narrow{width:120px}
    .hint{font-size:.8rem;color:var(--muted);margin-top:6px}
    .settings{display:grid;gap:4px}
    .settings .field-label:not(:first-child){margin-top:12px}
    .trip{display:grid;gap:4px;position:relative}
    .place{position:relative}
    .place-row{display:flex;gap:8px}
    .icon-btn{
      flex:none;
      width:44px;height:44px;
      display:grid;place-items:center;
      font-size:1.2rem;
      color:var(--fg);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:10px;
      cursor:pointer;
    }
    .swap{
      justify-self:end;
      margin:2px 52px -8px 0;
      background:none;border:none;color:var(--muted);
      font-size:1.2rem;cursor:pointer;padding:2px 8px;
    }
    .suggestions{
      position:absolute;z-index:1000;left:0;right:0;top:100%;
      margin:4px 0 0;padding:4px;list-style:none;
      background:var(--card);border:1px solid var(--line);border-radius:10px;
      box-shadow:0 8px 24px rgba(0,0,0,.12);
    }
    .suggestions button{
      display:grid;width:100%;text-align:left;gap:1px;
      font:inherit;color:inherit;background:none;border:none;
      padding:9px 10px;border-radius:8px;cursor:pointer;
    }
    .suggestions button:hover{background:var(--bg)}
    .s-main{font-weight:600}
    .s-sec{font-size:.85rem;color:var(--muted)}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      font:inherit;font-weight:600;text-decoration:none;
      color:var(--fg);background:var(--card);
      border:1px solid var(--line);border-radius:10px;
      padding:12px 16px;cursor:pointer;
    }
    .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
    .btn:disabled{opacity:.45;cursor:default}
    .btn.wide{width:100%;margin-top:12px}
    .log{display:grid;gap:4px;font-size:.9rem}
    .log .current{font-weight:600}
    .error{color:var(--bad);font-weight:600}
    .result{display:grid;gap:14px}
    .status{padding:12px 14px;border-radius:10px;font-weight:600}
    .status.ok{background:var(--ok-bg);color:var(--ok)}
    .status.warn{background:var(--warn-bg);color:var(--warn)}
    .status.note{background:var(--note-bg);color:var(--fg)}
    .status.warn p,.status.note p{margin-bottom:8px}
    .actions{display:grid;grid-template-columns:1fr auto;gap:8px}
    .parts{display:grid;gap:8px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--line);border-radius:12px}
    .tabs button{
      font:inherit;font-weight:600;font-size:.95rem;color:var(--muted);
      background:none;border:none;border-radius:9px;padding:9px 8px;cursor:pointer;
    }
    .tabs button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
    .trip-label{font-weight:600}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chip{background:var(--card);border-radius:999px;padding:3px 10px;font-size:.85rem;font-weight:500;color:var(--fg)}
    .chip b{color:var(--bad)}
    .assumed{color:var(--muted);font-size:.8rem;font-weight:400}
    .stats.two{grid-template-columns:1fr 1fr}
    .stats{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;margin:0}
    .stats div{min-width:0}
    .stats dt{font-size:.75rem;color:var(--muted)}
    .stats dd{margin:0;font-weight:600;font-size:.95rem}
    .stretches{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-weight:500}
    .stretches li{display:flex;align-items:center;gap:10px}
    .stretches .muted{margin-left:auto}
    .limit{
      flex:none;display:grid;place-items:center;
      width:30px;height:30px;border-radius:50%;
      border:3px solid var(--bad);background:#fff;color:#111;
      font-size:.75rem;font-weight:800;
    }
    .avoided summary{cursor:pointer;font-weight:600}
    .avoided .stretches{margin-top:10px}
    .map{height:340px;border-radius:10px;border:1px solid var(--line);overflow:hidden}
    .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin-top:-6px}
    .legend i{display:inline-block;width:18px;height:5px;border-radius:3px;vertical-align:middle;margin-right:5px;box-shadow:0 0 0 1px var(--card), 0 0 0 2px var(--line)}
    .legend i.dot{width:10px;height:10px;border-radius:50%}
    footer{text-align:center;padding:4px 8px}
    @media (max-width:420px){
      .stats{grid-template-columns:1fr 1fr}
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./moped-route-app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./moped-route-sw.js", { scope: "./moped-route" });
      });
    }
  </script>
</body>
</html>
